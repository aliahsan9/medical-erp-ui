TOP NAVBAR
<header class="topbar">

  <!-- LEFT -->
  <div class="left">
    <button class="menu-btn" (click)="toggleSidebar()">
      ☰
    </button>

    <div class="brand">
      <span class="logo">💊</span>
      <span>MedicalERP</span>
    </div>
  </div>

  <!-- RIGHT -->
  <div class="right">

    <div class="user-info">
      <div class="avatar">
        {{ user?.email?.charAt(0) || 'U' }}
      </div>
      <div class="details">
        <small>{{ user?.role }}</small>
        <div class="email">{{ user?.email }}</div>
      </div>
    </div>

    <button class="logout-btn" (click)="logout()">
      Logout
    </button>

  </div>

</header>

<!-- OVERLAY -->
<div class="overlay" *ngIf="sidebarOpen" (click)="closeSidebar()"></div>

<!-- SIDEBAR -->
<aside class="sidebar" [class.open]="sidebarOpen">

  <div class="sidebar-header">
    <h5>Menu</h5>
    <button (click)="closeSidebar()">✕</button>
  </div>

  <nav class="menu">

    <a routerLink="/dashboard" (click)="closeSidebar()">📊 Dashboard</a>
    <a routerLink="/products" (click)="closeSidebar()">💊 Products</a>
    <a routerLink="/sales" (click)="closeSidebar()">💰 Sales</a>
    <a routerLink="/inventory" (click)="closeSidebar()">📦 Inventory</a>
    <a routerLink="/invoices" (click)="closeSidebar()">📄 Invoices</a>
    <a routerLink="/reports" (click)="closeSidebar()">📈 Reports</a>

  </nav>

</aside>
