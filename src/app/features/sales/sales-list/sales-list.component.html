<div class="container-fluid sales-page">

  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold">Sales</h3>
    <a routerLink="/sales/create" class="btn btn-primary">
      + New Sale
    </a>
  </div>

  <div class="table-responsive shadow-sm bg-white rounded p-3">

    <table class="table table-hover align-middle">
      <thead class="table-light">
        <tr>
          <th>Invoice</th>
          <th>Customer</th>
          <th>Total</th>
          <th>Date</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let s of sales">
          <td class="fw-semibold">{{ s.invoiceNumber }}</td>
          <td>{{ s.customerName }}</td>
          <td class="text-success fw-bold">{{ s.totalAmount | currency:'PKR' }}</td>
          <td>{{ s.createdAt | date:'short' }}</td>
        </tr>
      </tbody>
    </table>

    <div *ngIf="!sales.length && !loading" class="text-center text-muted py-4">
      No sales found
    </div>

  </div>
</div>
