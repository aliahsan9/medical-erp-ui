<div class="container-fluid sales-create">

  <h3 class="mb-4 fw-bold">Create Sale</h3>

  <form [formGroup]="form" (ngSubmit)="submit()">

    <!-- Customer -->
    <div class="card p-3 mb-3 shadow-sm">
      <label class="form-label">Customer Name</label>
      <input class="form-control"
             formControlName="customerName"
             placeholder="Walk-In Customer">
    </div>

    <!-- Items -->
    <div class="card p-3 shadow-sm">

      <div class="d-flex justify-content-between mb-2">
        <h5 class="fw-bold">Items</h5>
        <button type="button" class="btn btn-sm btn-success" (click)="addItem()">
          + Add Item
        </button>
      </div>

      <div formArrayName="items">

        <div class="row g-2 align-items-end mb-2"
             *ngFor="let item of items.controls; let i = index"
             [formGroupName]="i">

          <div class="col-md-6">
            <label>Product ID</label>
            <input class="form-control" formControlName="productId">
          </div>

          <div class="col-md-3">
            <label>Qty</label>
            <input type="number" class="form-control" formControlName="quantity">
          </div>

          <div class="col-md-3">
            <button type="button"
                    class="btn btn-danger w-100"
                    (click)="removeItem(i)">
              Remove
            </button>
          </div>

        </div>

      </div>

    </div>

    <!-- Submit -->
    <div class="mt-3">
      <button class="btn btn-primary w-100" [disabled]="loading">
        {{ loading ? 'Saving...' : 'Create Sale' }}
      </button>
    </div>

  </form>
</div>
