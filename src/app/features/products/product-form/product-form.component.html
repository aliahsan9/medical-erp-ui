<div class="product-form-card">

  <div class="header">
    <h3>
      {{ editMode ? 'Update Product' : 'Add Product' }}
    </h3>

    <p>Manage medical inventory products</p>
  </div>

  <form (ngSubmit)="submitForm()">

    <div class="row g-4">

      <div class="col-lg-6">
        <label class="form-label">Product Name</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="product.name"
          name="name"
          required
          placeholder="Enter product name"
        />
      </div>

      <div class="col-lg-6">
        <label class="form-label">Category</label>

        <select
          class="form-select"
          [(ngModel)]="product.category"
          name="category"
          required
        >
          <option value="">Select Category</option>

          <option *ngFor="let cat of categories">
            {{ cat }}
          </option>

        </select>
      </div>

      <div class="col-lg-4">
        <label class="form-label">Selling Price</label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="product.price"
          name="price"
        />
      </div>

      <div class="col-lg-4">
        <label class="form-label">Cost Price</label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="product.costPrice"
          name="costPrice"
        />
      </div>

      <div class="col-lg-4">
        <label class="form-label">Stock Quantity</label>

        <input
          type="number"
          class="form-control"
          [(ngModel)]="product.stockQuantity"
          name="stockQuantity"
        />
      </div>

      <div class="col-lg-6">
        <label class="form-label">Expiry Date</label>

        <input
          type="date"
          class="form-control"
          [(ngModel)]="product.expiryDate"
          name="expiryDate"
        />
      </div>

      <div class="col-lg-6">
        <label class="form-label">Barcode</label>

        <input
          type="text"
          class="form-control"
          [(ngModel)]="product.barcode"
          name="barcode"
          placeholder="Enter barcode"
        />
      </div>

      <div class="col-12">

        <div class="form-check custom-check">

          <input
            class="form-check-input"
            type="checkbox"
            [(ngModel)]="product.isActive"
            name="isActive"
            id="activeCheck"
          />

          <label class="form-check-label" for="activeCheck">
            Product Active
          </label>

        </div>

      </div>

    </div>

    <button class="btn save-btn">

      <span *ngIf="!loading">
        {{ editMode ? 'Update Product' : 'Save Product' }}
      </span>

      <span *ngIf="loading">
        <span class="spinner-border spinner-border-sm"></span>
      </span>

    </button>

  </form>

</div>
