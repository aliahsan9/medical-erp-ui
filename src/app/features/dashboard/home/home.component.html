<div class="container-fluid dashboard">

  <!-- ========================= -->
  <!-- HEADER -->
  <!-- ========================= -->
  <div class="row mb-4">
    <div class="col-12">
      <h2 class="fw-bold">MedicalERP Dashboard</h2>
      <p class="text-muted">Welcome back! Here's your system overview.</p>
    </div>
  </div>

  <!-- ========================= -->
  <!-- KPI CARDS -->
  <!-- ========================= -->
  <div class="row g-3">

    <div class="col-12 col-md-3">
      <div class="card kpi-card bg-primary text-white">
        <div class="card-body">
          <h6>Total Sales</h6>
          <h3>₨ {{ totalSales }}</h3>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-3">
      <div class="card kpi-card bg-success text-white">
        <div class="card-body">
          <h6>Products</h6>
          <h3>{{ totalProducts }}</h3>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-3">
      <div class="card kpi-card bg-warning text-dark">
        <div class="card-body">
          <h6>Low Stock</h6>
          <h3>{{ lowStockItems }}</h3>
        </div>
      </div>
    </div>

    <div class="col-12 col-md-3">
      <div class="card kpi-card bg-danger text-white">
        <div class="card-body">
          <h6>Invoices</h6>
          <h3>{{ totalInvoices }}</h3>
        </div>
      </div>
    </div>

  </div>

  <!-- ========================= -->
  <!-- CHART SECTION -->
  <!-- ========================= -->
  <div class="row mt-4 g-3">

    <!-- SALES CHART -->
    <div class="col-12 col-lg-6">
      <div class="card chart-card">
        <div class="card-body">
          <h5>Sales Overview</h5>

          <div class="chart">
            <div class="bar" *ngFor="let s of salesChart"
                 [style.height.%]="s / 400">
            </div>
          </div>

        </div>
      </div>
    </div>

    <!-- STOCK CHART -->
    <div class="col-12 col-lg-6">
      <div class="card chart-card">
        <div class="card-body">
          <h5>Stock Levels</h5>

          <div class="chart stock">
            <div class="bar" *ngFor="let s of stockChart"
                 [style.height.%]="s">
            </div>
          </div>

        </div>
      </div>
    </div>

  </div>

  <!-- ========================= -->
  <!-- QUICK ACTIONS -->
  <!-- ========================= -->
  <div class="row mt-4">

    <div class="col-12">
      <div class="card p-3">
        <h5>Quick Actions</h5>

        <div class="d-flex flex-wrap gap-2 mt-2">

          <button class="btn btn-primary">➕ Add Product</button>
          <button class="btn btn-success">💰 New Sale</button>
          <button class="btn btn-warning">📦 Stock Entry</button>
          <button class="btn btn-dark">📄 View Reports</button>

        </div>

      </div>
    </div>

  </div>

</div>
