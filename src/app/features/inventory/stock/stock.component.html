<div class="container-fluid stock-page">

  <!-- HEADER -->
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h3 class="fw-bold">Inventory Stock</h3>
  </div>

  <div class="row g-3">

    <!-- FORM -->
    <div class="col-lg-4 col-md-5">

      <div class="card p-3 shadow-sm">

        <h5 class="mb-3">Stock Transaction</h5>

        <form [formGroup]="form" (ngSubmit)="submit()">

          <div class="mb-2">
            <label>Product ID</label>
            <input class="form-control" formControlName="productId">
          </div>

          <div class="mb-2">
            <label>Type</label>
            <select class="form-select" formControlName="type">
              <option [value]="types.StockIn">Stock In</option>
              <option [value]="types.StockOut">Stock Out</option>
            </select>
          </div>

          <div class="mb-2">
            <label>Quantity</label>
            <input type="number" class="form-control" formControlName="quantity">
          </div>

          <div class="mb-3">
            <label>Notes</label>
            <textarea class="form-control" formControlName="notes"></textarea>
          </div>

          <button class="btn btn-primary w-100" [disabled]="loading">
            {{ loading ? 'Processing...' : 'Submit' }}
          </button>

        </form>

      </div>
    </div>

    <!-- TABLE -->
    <div class="col-lg-8 col-md-7">

      <div class="card shadow-sm p-3">

        <h5 class="mb-3">Recent Transactions</h5>

        <div class="table-responsive">

          <table class="table table-hover align-middle">
            <thead class="table-light">
              <tr>
                <th>Product</th>
                <th>Type</th>
                <th>Qty</th>
                <th>Notes</th>
                <th>Date</th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let t of transactions">

                <td class="fw-semibold">{{ t.productName }}</td>

                <td>
                  <span class="badge"
                        [ngClass]="t.type === types.StockIn ? 'bg-success' : 'bg-danger'">
                    {{ t.type === types.StockIn ? 'IN' : 'OUT' }}
                  </span>
                </td>

                <td>{{ t.quantity }}</td>
                <td>{{ t.notes || '-' }}</td>
                <td>{{ t.createdAt | date:'short' }}</td>

              </tr>
            </tbody>

          </table>

        </div>

      </div>

    </div>

  </div>
</div>
